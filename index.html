<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ASH Tek Crew | Now Booking</title>
<meta name="description" content="All Saints High School Tech Crew. Tech equipment and venue booking." />
<!-- Fallback: if scripts are off, still open the booking form -->
<noscript><meta http-equiv="refresh" content="3;url=index.html" /></noscript>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="preload" as="image" href="tekcrew-logo.png" />
<style>
:root{
  --navy-950:#030915; --navy-900:#0A192F; --navy-700:#1E3A8A;
  --maroon-900:#4a0013; --maroon-800:#800020; --maroon-700:#991B1B;
  --gold-500:#F59E0B; --gold-300:#FDE68A;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--navy-950);color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden;cursor:pointer}

/* ---------- Stage ---------- */
.stage{position:fixed;inset:0;display:grid;place-items:center;
  background:
    radial-gradient(ellipse 60% 45% at 50% 52%,rgba(30,58,138,.55),transparent 70%),
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/28px 28px,
    linear-gradient(180deg,var(--navy-950),var(--navy-900) 60%,#050d1c)}
/* stage floor */
.floor{position:absolute;left:-10%;right:-10%;bottom:0;height:24vh;
  background:linear-gradient(180deg,#140a10,#000);transform:perspective(500px) rotateX(55deg);transform-origin:bottom;
  box-shadow:0 -2px 0 rgba(245,158,11,.4)}
.floor::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 30% 60% at 50% 20%,rgba(253,230,138,.35),transparent 70%);opacity:0;animation:fadeIn 1s 3.2s both}

/* ---------- Marquee bulbs (top + bottom) ---------- */
.rig{position:absolute;left:0;right:0;height:26px;display:flex;justify-content:space-around;align-items:center;padding:0 .6rem;z-index:6;
  background:linear-gradient(#02060E,#0A192F)}
.rig.top{top:0;border-bottom:2px solid #1F2A3D}
.rig.bottom{bottom:0;border-top:2px solid #1F2A3D}
.bulb{--c:var(--gold-500);width:10px;height:10px;border-radius:50%;background:var(--c);opacity:.25;
  animation:chase 1.4s infinite;animation-delay:calc(var(--i)*70ms)}
@keyframes chase{0%,35%,100%{opacity:.25;box-shadow:none}10%{opacity:1;box-shadow:0 0 6px 2px var(--c),0 0 18px 4px var(--c)}}

/* ---------- Countdown (film-leader style) ---------- */
.leader{position:absolute;z-index:5;width:min(46vmin,340px);aspect-ratio:1;display:grid;place-items:center;pointer-events:none;
  animation:leaderOut .35s 2.15s ease-in forwards}
.leader::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid rgba(253,230,138,.6);
  background:conic-gradient(rgba(245,158,11,.35) var(--sweep,0deg),transparent 0);animation:sweep .7s linear 3}
.leader::after{content:"";position:absolute;inset:12%;border-radius:50%;border:2px solid rgba(253,230,138,.35)}
.leader i{position:absolute;left:50%;top:-10%;bottom:-10%;width:2px;background:rgba(253,230,138,.3)}
.leader b{position:absolute;top:50%;left:-10%;right:-10%;height:2px;background:rgba(253,230,138,.3)}
.count{font:800 clamp(90px,24vmin,180px)/1 Poppins,sans-serif;color:var(--gold-300);text-shadow:0 0 30px rgba(245,158,11,.7);position:relative}
@property --sweep{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes sweep{from{--sweep:0deg}to{--sweep:360deg}}
@keyframes leaderOut{to{opacity:0;transform:scale(1.6)}}

/* ---------- Curtains ---------- */
.curtain{position:absolute;top:0;bottom:0;width:51%;z-index:4;
  background:
    linear-gradient(180deg,rgba(0,0,0,.35),transparent 18%,transparent 80%,rgba(0,0,0,.5)),
    repeating-linear-gradient(90deg,var(--maroon-900) 0,var(--maroon-800) 3.5%,#a3122f 5.5%,var(--maroon-800) 7.5%,var(--maroon-900) 10%);
  box-shadow:inset 0 -30px 40px rgba(0,0,0,.4);
  transition:transform 1.5s cubic-bezier(.7,0,.25,1)}
.curtain.left{left:0;transform-origin:left}
.curtain.right{right:0;transform-origin:right}
.curtain::after{content:"";position:absolute;bottom:18%;width:18px;height:36px;border-radius:6px;background:linear-gradient(var(--gold-300),var(--gold-500));box-shadow:0 0 10px rgba(245,158,11,.6)}
.curtain.left::after{right:6%}
.curtain.right::after{left:6%}
.valance{position:absolute;top:26px;left:0;right:0;height:9vh;z-index:5;
  background:
    radial-gradient(ellipse 50% 100% at 50% 0,var(--maroon-800) 60%,transparent 62%) 0 0/12.5% 100% repeat-x,
    linear-gradient(var(--maroon-900),var(--maroon-800));
  -webkit-mask:radial-gradient(ellipse 50% 100% at 50% 0,#000 98%,transparent 100%) 0 0/12.5% 100% repeat-x;
          mask:radial-gradient(ellipse 50% 100% at 50% 0,#000 98%,transparent 100%) 0 0/12.5% 100% repeat-x;
  border-top:4px solid var(--gold-500)}
body.open .curtain.left,body.open .curtain.right{transform:scaleX(.15)}
body.closing .curtain.left,body.closing .curtain.right{transform:none;transition-duration:.9s}

/* ---------- Spotlights ---------- */
.spot{position:absolute;top:-6vh;width:46vmin;height:120vh;z-index:3;pointer-events:none;transform-origin:50% 0;opacity:0;
  background:linear-gradient(to bottom,rgba(255,240,200,.55),rgba(245,158,11,.14) 65%,transparent);
  clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);filter:blur(4px);mix-blend-mode:screen}
.spot.l{left:8%;animation:fadeIn .4s 2.4s both,swingL 2.6s 2.4s cubic-bezier(.4,0,.2,1) both}
.spot.r{right:8%;background:linear-gradient(to bottom,rgba(191,219,254,.5),rgba(30,58,138,.18) 65%,transparent);
  animation:fadeIn .4s 2.4s both,swingR 2.6s 2.4s cubic-bezier(.4,0,.2,1) both}
@keyframes swingL{0%{transform:rotate(55deg)}45%{transform:rotate(-25deg)}100%{transform:rotate(-24deg)}}
@keyframes swingR{0%{transform:rotate(-55deg)}45%{transform:rotate(25deg)}100%{transform:rotate(24deg)}}

/* ---------- Headline block ---------- */
.show{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:1.6vmin;margin-top:-2vh;padding:0 16px;text-align:center}
.presents{font:600 clamp(10px,1.6vmin,13px)/1 Inter,sans-serif;letter-spacing:.45em;color:#CBD5E1;opacity:0;animation:rise .6s 3.1s both}
.logo-wrap{position:relative;width:min(70vmin,560px);opacity:0;animation:logoIn 1.1s 3.25s cubic-bezier(.18,1.25,.4,1) both}
.logo-wrap img{display:block;width:100%;height:auto;filter:drop-shadow(0 0 0 rgba(245,158,11,0));animation:glow 2.4s 4.3s ease-in-out infinite}
/* glint sweeping across the logo */
.logo-wrap::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 48%,transparent 60%) no-repeat;background-size:250% 100%;background-position:150% 0;
  -webkit-mask:url(tekcrew-logo.png) center/contain no-repeat;mask:url(tekcrew-logo.png) center/contain no-repeat;
  animation:glint 1.2s 4.2s ease-in-out both}
@keyframes logoIn{0%{opacity:0;transform:translateY(-45vh) scale(.6) rotate(-6deg)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes glint{to{background-position:-50% 0}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px rgba(245,158,11,.25))}50%{filter:drop-shadow(0 0 22px rgba(245,158,11,.7))}}

.now{display:flex;align-items:center;gap:.9rem;opacity:0;animation:rise .6s 4.1s both}
.now span{font:800 clamp(18px,3.4vmin,30px)/1 Poppins,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-300);text-shadow:0 0 18px rgba(245,158,11,.55)}
.now i{width:clamp(24px,6vmin,60px);height:3px;border-radius:2px;background:var(--maroon-700);transform:skewX(-30deg)}
.sub{margin:0;font-size:clamp(12px,1.9vmin,15px);color:#CBD5E1;opacity:0;animation:rise .6s 4.35s both}

/* ---------- Ticket loader ---------- */
.ticket{position:absolute;bottom:calc(26px + 4.5vh);left:50%;z-index:2;translate:-50% 0;display:flex;align-items:stretch;
  background:linear-gradient(120deg,var(--maroon-800),var(--maroon-900));border:2px solid var(--gold-500);border-radius:8px;
  opacity:0;animation:rise .5s 4.5s both;min-width:min(340px,82vw)}
.ticket .main{flex:1;padding:.6rem .9rem}
.ticket .main p{margin:0 0 .45rem;font:700 10px/1 Inter,sans-serif;letter-spacing:.25em;color:var(--gold-300)}
.ticket .bar{height:5px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}
.ticket .bar b{display:block;height:100%;background:linear-gradient(90deg,var(--gold-500),var(--gold-300));transform-origin:left;transform:scaleX(0);animation:load 2.6s 4.6s linear both}
.ticket .stub{display:grid;place-items:center;padding:0 .8rem;border-left:2px dashed rgba(245,158,11,.7);font:800 10px/1.2 Poppins,sans-serif;letter-spacing:.12em;color:#fff;text-align:center}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#EF4444;margin-right:4px;animation:blink 1s steps(2,jump-none) infinite}
@keyframes load{to{transform:scaleX(1)}}
@keyframes blink{50%{opacity:.15}}

/* ---------- Confetti ---------- */
.confetti{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.confetti span{position:absolute;top:-4vh;width:8px;height:14px;border-radius:2px;opacity:0;animation:fall var(--d) var(--delay) linear both}
@keyframes fall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:.9;transform:translate(var(--x),110vh) rotate(var(--r))}}

/* ---------- Skip ---------- */
.skip{position:absolute;top:40px;right:18px;z-index:7;background:rgba(3,9,21,.55);color:#fff;border:1px solid rgba(245,158,11,.6);border-radius:999px;
  padding:.55rem 1rem;font:600 12px Inter,sans-serif;letter-spacing:.06em;cursor:pointer;opacity:0;animation:fadeIn .4s .5s both}
.skip:hover{background:var(--maroon-800)}
.skip:focus-visible{outline:3px solid var(--gold-500);outline-offset:3px}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

@media (max-width:640px){.logo-wrap{width:88vw}.valance{height:6vh}.now{gap:.5rem}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}
  .leader{display:none}
}
</style>
</head>
<body>
<button class="skip" id="skip" type="button">Skip intro &#8594;</button>

<div class="stage">
  <div class="rig top" id="rigTop" aria-hidden="true"></div>

  <div class="spot l" aria-hidden="true"></div>
  <div class="spot r" aria-hidden="true"></div>
  <div class="floor" aria-hidden="true"></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <main class="show">
    <p class="presents">ALL SAINTS HIGH SCHOOL PRESENTS</p>
    <div class="logo-wrap"><img src="tekcrew-logo.png" alt="ASH Tek Crew" width="900" height="661" /></div>
    <div class="now" aria-hidden="true"><i></i><span>Now Booking</span><i></i></div>
    <p class="sub">Tech Equipment &amp; Venue Booking</p>
  </main>

  <div class="ticket" aria-hidden="true">
    <div class="main"><p>DOORS OPENING&hellip;</p><div class="bar"><b></b></div></div>
    <div class="stub"><span><span class="live"></span>LIVE</span>ADMIT ONE</div>
  </div>

  <div class="curtain left" aria-hidden="true"></div>
  <div class="curtain right" aria-hidden="true"></div>
  <div class="valance" aria-hidden="true"></div>

  <div class="leader" aria-hidden="true"><i></i><b></b><span class="count" id="count">3</span></div>

  <div class="rig bottom" id="rigBottom" aria-hidden="true"></div>
</div>

<script>
'use strict';
const DESTINATION = 'index.html';   // where the intro sends people
const INTRO_MS    = 7400;           // when the curtains start closing (ms)

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Marquee bulbs, same colours as the booking page
const colors = ['#F59E0B','#EF4444','#3B82F6','#FFFFFF'];
for (const id of ['rigTop','rigBottom']) {
  const rig = document.getElementById(id);
  const n = Math.max(12, Math.round(innerWidth / 48));
  for (let i=0;i<n;i++){
    const b=document.createElement('span'); b.className='bulb';
    b.style.setProperty('--i', id==='rigTop' ? i : n-i);
    b.style.setProperty('--c', colors[i%colors.length]);
    rig.append(b);
  }
}

// 3 · 2 · 1 countdown, then curtains up
const count = document.getElementById('count');
if (!reduced) {
  [700,1400].forEach((t,i)=>setTimeout(()=>count.textContent = 2-i, t));
  setTimeout(()=>document.body.classList.add('open'), 2150);
} else {
  document.body.classList.add('open');
}

// Confetti drop when the logo lands
if (!reduced) {
  const box = document.getElementById('confetti');
  const palette = ['#F59E0B','#FDE68A','#991B1B','#FFFFFF','#3B82F6'];
  for (let i=0;i<70;i++){
    const c=document.createElement('span');
    c.style.left = Math.random()*100 + '%';
    c.style.background = palette[i%palette.length];
    c.style.setProperty('--x', (Math.random()*30-15) + 'vw');
    c.style.setProperty('--r', (Math.random()*1080-540) + 'deg');
    c.style.setProperty('--d', (2.2+Math.random()*1.8) + 's');
    c.style.setProperty('--delay', (3.6+Math.random()*1.2) + 's');
    if (Math.random()>.6){ c.style.width='10px'; c.style.height='10px'; c.style.borderRadius='50%'; }
    box.append(c);
  }
}

// Curtains close, then off to the booking form
let gone=false;
function go(){
  if (gone) return; gone=true;
  if (reduced){ location.replace(DESTINATION); return; }
  document.body.classList.remove('open');
  document.body.classList.add('closing');
  setTimeout(()=>location.replace(DESTINATION), 900);
}
setTimeout(go, reduced ? 1800 : INTRO_MS);
document.getElementById('skip').addEventListener('click',e=>{e.stopPropagation();go();});
document.body.addEventListener('click',go);
addEventListener('keydown',e=>{ if(['Enter',' ','Escape'].includes(e.key)) go(); });
</script>
</body>
</html>
